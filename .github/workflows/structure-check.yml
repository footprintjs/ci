name: Structure checker fixtures
on:
  push:
    paths: ['src/structure/**', '.github/workflows/structure-*.yml']
  pull_request:
    paths: ['src/structure/**', '.github/workflows/structure-*.yml']
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src/structure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          TS_ETW_MODULE_PATH: ''
