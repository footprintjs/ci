name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify committed bundle and metadata
        run: git diff --exit-code -- dist/release.cjs dist/build-metadata.json dist/propose.cjs dist/propose-metadata.json dist/propose-writer.cjs dist/propose-writer-metadata.json

  file-size:
    uses: footprintjs/ci/.github/workflows/file-size.yml@fdafcc1e11197c2d38b49427aaca30e0e6a72d6a
    with:
      tool_sha: fdafcc1e11197c2d38b49427aaca30e0e6a72d6a
